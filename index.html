<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT5 Garis Penanda</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #0a0e1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    overflow-x: hidden;
  }
  body { min-height: 100vh; padding-bottom: 60px; }

  /* ── TOOLBAR ── */
  #toolbar {
    position: sticky; top: 0; z-index: 200;
    background: #0f1729; border-bottom: 1px solid #1e2a44;
    padding: 8px 10px;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  #toolbar h3 { font-size: 12px; color: #4fc3f7; font-weight: 700; width: 100%; margin-bottom: 2px; }
  .btn {
    padding: 7px 11px; border: none; border-radius: 5px;
    font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .btn:active { opacity: 0.7; }
  .btn-line-b  { background: #222; color: #fff; border: 1px solid #444; }
  .btn-line-g  { background: #777; color: #fff; }
  .btn-rect    { background: #37474f; color: #cfd8dc; }
  .btn-upload  { background: #1565c0; color: #fff; }
  .btn-preview { background: #00897b; color: #fff; }
  .btn-dl      { background: #6a1b9a; color: #fff; }
  .btn-reset   { background: #4a3000; color: #ffcc80; }
  #file-input  { display: none; }

  /* ── CANVAS OUTER: gives scroll space on sides ── */
  #canvas-outer {
    width: 100%;
    padding: 0 18px;          /* ← spare kiri-kanan untuk jempol */
    background: #0a0e1a;
  }

  /* ── CANVAS WRAP ── */
  #canvas-wrap {
    position: relative;
    width: 100%;
    background: #ffffff;
    border-bottom: 2px solid #1e2a44;
    overflow: hidden;
    aspect-ratio: 9/16;
    /* touch-action none only on svg, not whole wrap */
  }
  #canvas-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain; object-position: center top;
    pointer-events: none; user-select: none; -webkit-user-drag: none;
  }
  #svg-rects, #svg-lines {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    overflow: visible;
  }
  #svg-rects { z-index: 2; }
  #svg-lines  { z-index: 3; }
  /* corner handles group — hidden in preview */
  .handles-group { pointer-events: all; }

  #upload-overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,14,26,0.92);
    flex-direction: column; gap: 14px; padding: 20px; text-align: center;
  }
  #upload-overlay p    { color: #4fc3f7; font-size: 14px; font-weight: 700; }
  #upload-overlay span { color: #90a4ae; font-size: 11px; }

  #drag-hint {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: #fff;
    font-size: 10px; padding: 4px 10px; border-radius: 10px;
    pointer-events: none; white-space: nowrap; z-index: 5;
  }

  /* ── PANEL ── */
  #panel { padding: 12px 10px; }
  .section-title {
    font-size: 10px; color: #4fc3f7; text-transform: uppercase;
    letter-spacing: 1.2px; margin: 14px 0 8px 4px;
    border-bottom: 1px solid #1e2a44; padding-bottom: 4px;
  }
  .card {
    background: #0f1729; border: 1px solid #1e2a44;
    border-radius: 8px; margin-bottom: 8px; overflow: hidden;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; font-size: 12px; font-weight: 700;
  }
  .card-header.black { background: #111; color: #fff; }
  .card-header.gray  { background: #444; color: #eee; }
  .card-header.rect  { background: #1a2a1a; color: #81c784; }
  .card-body {
    padding: 10px 12px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px;
  }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 9px; color: #708090; text-transform: uppercase; letter-spacing: 0.5px; }
  .field input {
    padding: 7px 8px; background: #0a0e1a;
    border: 1px solid #1e2a44; border-radius: 5px;
    color: #e0e0e0; font-size: 12px; text-align: right;
    width: 100%; font-family: inherit;
  }
  .field input:focus { outline: none; border-color: #4fc3f7; }
  .full { grid-column: 1 / -1; }
  .btn-del {
    grid-column: 1 / -1; padding: 7px; background: #2a1818;
    border: 1px solid #4a2020; border-radius: 5px;
    color: #ef9a9a; font-size: 11px; font-weight: 700; cursor: pointer; margin-top: 4px;
  }
  .btn-del:active { background: #c62828; color: #fff; }

  /* ── PREVIEW ── */
  body.preview #toolbar,
  body.preview #panel,
  body.preview #canvas-outer { padding: 0 !important; }
  body.preview #toolbar,
  body.preview #panel         { display: none; }
  body.preview #canvas-outer  { padding: 0; }
  body.preview #canvas-wrap   { aspect-ratio: unset; min-height: 100vh; border: none; }
  body.preview #drag-hint     { display: none; }
  /* Hide corner handles in preview */
  body.preview .handles-group { display: none; }

  #exit-preview {
    display: none; position: fixed; top: 12px; right: 12px; z-index: 999;
    padding: 8px 14px; background: rgba(0,0,0,0.75); color: #fff;
    border: none; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  body.preview #exit-preview { display: block; }

  /* Download toast */
  #dl-toast {
    display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #1b5e20; color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: 12px; font-weight: 700; z-index: 999; white-space: nowrap;
  }
</style>
</head>
<body>

<div id="toolbar">
  <h3>📐 MT5 Garis Penanda + Block Area</h3>
  <button class="btn btn-line-b" onclick="addLine('black')">＋ Garis Hitam</button>
  <button class="btn btn-line-g" onclick="addLine('gray')">＋ Garis Abu</button>
  <button class="btn btn-rect"   onclick="addRect()">＋ Block</button>
  <button class="btn btn-upload" onclick="document.getElementById('file-input').click()">📷 Upload</button>
  <input type="file" id="file-input" accept="image/*" onchange="loadImage(event)">
  <button class="btn btn-preview" onclick="enterPreview()">👁 Preview</button>
  <button class="btn btn-dl"      onclick="downloadImg()">⬇ Download</button>
  <button class="btn btn-reset"   onclick="resetAll()">↺ Reset</button>
</div>

<div id="canvas-outer">
  <div id="canvas-wrap">
    <img id="canvas-bg" alt="" draggable="false">
    <svg id="svg-rects"></svg>
    <svg id="svg-lines"></svg>

    <div id="upload-overlay">
      <p>📸 Upload Screenshot Chart MT5</p>
      <span>Tap Upload atau drag & drop ke sini</span>
      <button class="btn btn-upload" style="padding:10px 22px;font-size:13px;"
              onclick="document.getElementById('file-input').click()">Upload Screenshot</button>
    </div>

    <div id="drag-hint">💡 Drag garis/sudut kotak</div>
  </div>
</div>

<div id="panel">
  <div id="lines-section"></div>
  <div id="rects-section"></div>
</div>

<button id="exit-preview" onclick="exitPreview()">✕ Exit Preview</button>
<div id="dl-toast">✅ Gambar diunduh!</div>

<script>
// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let lines = [];
let rects = [];
let nextId = 1;
let drag = null;
let canvasEl, svgLines, svgRects, imgEl;
const LINE_COLORS = { black: '#000000', gray: '#888888' };
const HR = 14; // corner handle radius (larger = easier to tap)

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  canvasEl = document.getElementById('canvas-wrap');
  svgLines = document.getElementById('svg-lines');
  svgRects = document.getElementById('svg-rects');
  imgEl    = document.getElementById('canvas-bg');

  const outer = document.getElementById('canvas-outer');
  outer.addEventListener('dragover', e => e.preventDefault());
  outer.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadFile(f);
  });

  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup',   onUp);
  window.addEventListener('touchmove', onTouchMove, { passive: false });
  window.addEventListener('touchend',  onUp);
  window.addEventListener('resize',    renderAll);

  renderAll();
});

// ═══════════════════════════════════════════════
// IMAGE
// ═══════════════════════════════════════════════
function loadImage(e) { const f = e.target.files[0]; if (f) loadFile(f); }
function loadFile(f) {
  const url = URL.createObjectURL(f);
  imgEl.src = url;
  imgEl.onload = () => {
    const r = imgEl.naturalWidth / imgEl.naturalHeight;
    canvasEl.style.aspectRatio = r;
    document.getElementById('upload-overlay').style.display = 'none';
    renderAll();
  };
}

// ═══════════════════════════════════════════════
// ADD
// ═══════════════════════════════════════════════
function addLine(color) {
  const W = canvasEl.clientWidth || 300;
  lines.push({
    id: nextId++, color,
    py: 50,
    label: '',
    labelX: W - 82,
    labelW: 80,
    labelH: 22,
  });
  renderAll(); renderPanel();
}

function addRect() {
  rects.push({
    id: nextId++,
    x1: 50, y1: 20,
    x2: 98, y2: 80,
  });
  renderAll(); renderPanel();
}

function deleteLine(id) { lines = lines.filter(l => l.id !== id); renderAll(); renderPanel(); }
function deleteRect(id) { rects = rects.filter(r => r.id !== id); renderAll(); renderPanel(); }

function resetAll() {
  lines = []; rects = []; nextId = 1;
  renderAll(); renderPanel();
}

// ═══════════════════════════════════════════════
// RENDER SVG
// ═══════════════════════════════════════════════
function renderAll() {
  svgRects.innerHTML = '';
  svgLines.innerHTML = '';
  const W = canvasEl.clientWidth;
  const H = canvasEl.clientHeight;
  if (!W || !H) return;

  // ── LAYER 1: RECTANGLES ─────────────────────
  rects.forEach(r => {
    const ax1 = (r.x1/100)*W, ay1 = (r.y1/100)*H;
    const ax2 = (r.x2/100)*W, ay2 = (r.y2/100)*H;
    const rx = Math.min(ax1,ax2), ry = Math.min(ay1,ay2);
    const rw = Math.abs(ax2-ax1),  rh = Math.abs(ay2-ay1);

    // Solid white fill
    svgRects.appendChild(mkEl('rect',{x:rx,y:ry,width:rw,height:rh,fill:'#FFFFFF','pointer-events':'none'}));

    // Move area (center 50%)
    const moveEl = mkEl('rect',{
      x: rx+rw*0.15, y: ry+rh*0.15,
      width: rw*0.7, height: rh*0.7,
      fill:'transparent', cursor:'move', 'pointer-events':'all'
    });
    addDragEvt(moveEl, e => startRectMove(clientXY(e), r.id),
                       e => startRectMove(touchXY(e),  r.id));
    svgRects.appendChild(moveEl);

    // Corner handles group (hidden in preview via CSS)
    const hg = mkEl('g',{class:'handles-group'});

    const corners = [
      { x: ax1, y: ay1, c: 'tl', cur: 'nw-resize' },
      { x: ax2, y: ay1, c: 'tr', cur: 'ne-resize' },
      { x: ax1, y: ay2, c: 'bl', cur: 'sw-resize' },
      { x: ax2, y: ay2, c: 'br', cur: 'se-resize' },
    ];
    corners.forEach(({ x, y, c, cur }) => {
      // Visual dot
      const vis = mkEl('circle',{cx:x,cy:y,r:6,fill:'#37474f',stroke:'#90a4ae','stroke-width':'1.5','pointer-events':'none'});
      // Large invisible hit circle for easy tapping
      const hit = mkEl('circle',{cx:x,cy:y,r:HR,fill:'transparent',cursor:cur,'pointer-events':'all'});
      addDragEvt(hit, e => startRectCorner(clientXY(e), r.id, c),
                      e => startRectCorner(touchXY(e),  r.id, c));
      hg.appendChild(vis);
      hg.appendChild(hit);
    });
    svgRects.appendChild(hg);
  });

  // ── LAYER 2: LINES ──────────────────────────
  lines.forEach(l => {
    const color = LINE_COLORS[l.color];
    const py    = (l.py/100)*H;
    const lW    = l.labelW || 80;
    const lH    = l.labelH || 22;
    const lX    = Math.max(0, Math.min(W - lW, l.labelX));
    const lY    = py - lH/2;

    // Solid line
    svgLines.appendChild(mkEl('line',{x1:0,y1:py,x2:W,y2:py,stroke:color,'stroke-width':'1.2'}));

    // Line drag hit
    const lineHit = mkEl('line',{x1:0,y1:py,x2:W,y2:py,stroke:'transparent','stroke-width':'22',cursor:'ns-resize','pointer-events':'all'});
    addDragEvt(lineHit, e => startLineDrag(clientXY(e), l.id),
                        e => startLineDrag(touchXY(e),  l.id));
    svgLines.appendChild(lineHit);

    // Label box
    const fs = Math.max(8, Math.round(lH * 0.62));
    const charsEst = l.label ? l.label.length : 1;
    const textFit  = Math.min(fs, Math.floor((lW - 6) / Math.max(1, charsEst * 0.58)));
    const finalFs  = Math.max(8, textFit);

    svgLines.appendChild(mkEl('rect',{x:lX,y:lY,width:lW,height:lH,fill:color}));

    const txt = mkEl('text',{
      x: lX+lW/2, y: py+0.5,
      fill:'#ffffff',
      'font-family':'Segoe UI,Roboto,Arial,sans-serif',
      'font-size': finalFs,
      'font-weight':'400',
      'text-anchor':'middle',
      'dominant-baseline':'central',
      'pointer-events':'none'
    });
    txt.textContent = l.label || '';
    svgLines.appendChild(txt);

    // Label horizontal drag hit
    const lblHit = mkEl('rect',{x:lX,y:lY,width:lW,height:lH,fill:'transparent',cursor:'ew-resize','pointer-events':'all'});
    addDragEvt(lblHit, e => startLabelDrag(clientXY(e), l.id),
                       e => startLabelDrag(touchXY(e),  l.id));
    svgLines.appendChild(lblHit);
  });
}

// ═══════════════════════════════════════════════
// RENDER PANEL
// ═══════════════════════════════════════════════
function renderPanel() {
  renderLinesSection();
  renderRectsSection();
}
function renderLinesSection() {
  const sec = document.getElementById('lines-section');
  sec.innerHTML = '';
  if (!lines.length) return;
  const t = document.createElement('div'); t.className='section-title'; t.textContent='📏 Garis Penanda'; sec.appendChild(t);
  lines.forEach(l => {
    const cls = l.color === 'black' ? 'black' : 'gray';
    const lbl = l.color === 'black' ? '⬛ Hitam' : '▪️ Abu-abu';
    const card = document.createElement('div'); card.className='card'; card.dataset.id=l.id;
    card.innerHTML = `
      <div class="card-header ${cls}"><span>${lbl} #${l.id}</span></div>
      <div class="card-body">
        <div class="field full"><label>Label teks</label>
          <input type="text" value="${l.label||''}" placeholder="kosong = no text"
                 onchange="updateLine(${l.id},'label',this.value)">
        </div>
        <div class="field"><label>Posisi Y (%)</label>
          <input type="number" step="0.1" min="0" max="100" value="${l.py.toFixed(1)}"
                 onchange="updateLine(${l.id},'py',this.value)">
        </div>
        <div class="field"><label>Label X (px)</label>
          <input type="number" min="0" max="2000" value="${Math.round(l.labelX)}"
                 onchange="updateLine(${l.id},'labelX',this.value)">
        </div>
        <div class="field"><label>Kotak W (px)</label>
          <input type="number" min="0" max="500" value="${l.labelW}"
                 onchange="updateLine(${l.id},'labelW',this.value)">
        </div>
        <div class="field"><label>Kotak H (px)</label>
          <input type="number" min="0" max="200" value="${l.labelH}"
                 onchange="updateLine(${l.id},'labelH',this.value)">
        </div>
        <button class="btn-del" onclick="deleteLine(${l.id})">🗑 Hapus Garis</button>
      </div>`;
    sec.appendChild(card);
  });
}
function renderRectsSection() {
  const sec = document.getElementById('rects-section');
  sec.innerHTML = '';
  if (!rects.length) return;
  const t = document.createElement('div'); t.className='section-title'; t.textContent='⬜ Block Area'; sec.appendChild(t);
  rects.forEach(r => {
    const card = document.createElement('div'); card.className='card'; card.dataset.rid=r.id;
    card.innerHTML = `
      <div class="card-header rect"><span>⬜ Block #${r.id}</span><span style="font-size:10px;opacity:0.6;font-weight:400;">drag sudut di canvas</span></div>
      <div class="card-body">
        <div class="field"><label>X1 (%)</label>
          <input type="number" step="0.1" min="0" max="100" value="${r.x1.toFixed(1)}"
                 onchange="updateRect(${r.id},'x1',this.value)">
        </div>
        <div class="field"><label>Y1 (%)</label>
          <input type="number" step="0.1" min="0" max="100" value="${r.y1.toFixed(1)}"
                 onchange="updateRect(${r.id},'y1',this.value)">
        </div>
        <div class="field"><label>X2 (%)</label>
          <input type="number" step="0.1" min="0" max="100" value="${r.x2.toFixed(1)}"
                 onchange="updateRect(${r.id},'x2',this.value)">
        </div>
        <div class="field"><label>Y2 (%)</label>
          <input type="number" step="0.1" min="0" max="100" value="${r.y2.toFixed(1)}"
                 onchange="updateRect(${r.id},'y2',this.value)">
        </div>
        <button class="btn-del" onclick="deleteRect(${r.id})">🗑 Hapus Block</button>
      </div>`;
    sec.appendChild(card);
  });
}

// ═══════════════════════════════════════════════
// UPDATE FROM PANEL
// ═══════════════════════════════════════════════
function updateLine(id, field, val) {
  const l = lines.find(x=>x.id===id); if(!l) return;
  if (field==='label') { l.label=val; }
  else { const n=parseFloat(val); if(isNaN(n)) return;
    if(field==='py')     l.py     = clamp(n,0,100);
    else if(field==='labelX') l.labelX = clamp(n,0,2000);
    else if(field==='labelW') l.labelW = clamp(n,0,500);
    else if(field==='labelH') l.labelH = clamp(n,0,200);
  }
  renderAll();
}
function updateRect(id, field, val) {
  const r = rects.find(x=>x.id===id); if(!r) return;
  const n = parseFloat(val); if(isNaN(n)) return;
  r[field] = clamp(n,0,100);
  renderAll();
}

// ═══════════════════════════════════════════════
// DRAG START HELPERS
// ═══════════════════════════════════════════════
function startLineDrag({x,y}, id) {
  const l = lines.find(v=>v.id===id); if(!l) return;
  drag = { type:'line', id, startY:y, startPy:l.py };
}
function startLabelDrag({x,y}, id) {
  const l = lines.find(v=>v.id===id); if(!l) return;
  drag = { type:'label', id, startX:x, startLX:l.labelX };
}
function startRectCorner({x,y}, id, corner) {
  const r = rects.find(v=>v.id===id); if(!r) return;
  drag = { type:'rect-corner', id, corner, startX:x, startY:y,
           sx1:r.x1, sy1:r.y1, sx2:r.x2, sy2:r.y2 };
}
function startRectMove({x,y}, id) {
  const r = rects.find(v=>v.id===id); if(!r) return;
  drag = { type:'rect-move', id, startX:x, startY:y,
           sx1:r.x1, sy1:r.y1, sx2:r.x2, sy2:r.y2 };
}

// ═══════════════════════════════════════════════
// DRAG MOVE
// ═══════════════════════════════════════════════
function onMove(e)      { if(drag) doMove(e.clientX, e.clientY); }
function onTouchMove(e) {
  if(!drag) return;
  e.preventDefault();
  doMove(e.touches[0].clientX, e.touches[0].clientY);
}
function doMove(cx,cy) {
  if(!drag) return;
  const W = canvasEl.clientWidth, H = canvasEl.clientHeight;

  if (drag.type==='line') {
    const l = lines.find(x=>x.id===drag.id); if(!l) return;
    l.py = clamp(drag.startPy + ((cy-drag.startY)/H)*100, 0.5, 99.5);
    renderAll(); syncLineCard(l);
  }
  else if (drag.type==='label') {
    const l = lines.find(x=>x.id===drag.id); if(!l) return;
    l.labelX = clamp(drag.startLX + (cx-drag.startX), 0, W-(l.labelW||80));
    renderAll(); syncLineCard(l);
  }
  else if (drag.type==='rect-corner') {
    const r = rects.find(x=>x.id===drag.id); if(!r) return;
    const dxP = ((cx-drag.startX)/W)*100;
    const dyP = ((cy-drag.startY)/H)*100;
    const c = drag.corner;
    if (c==='tl'||c==='bl') r.x1 = clamp(drag.sx1+dxP);
    if (c==='tr'||c==='br') r.x2 = clamp(drag.sx2+dxP);
    if (c==='tl'||c==='tr') r.y1 = clamp(drag.sy1+dyP);
    if (c==='bl'||c==='br') r.y2 = clamp(drag.sy2+dyP);
    renderAll(); syncRectCard(r);
  }
  else if (drag.type==='rect-move') {
    const r = rects.find(x=>x.id===drag.id); if(!r) return;
    const dxP = ((cx-drag.startX)/W)*100;
    const dyP = ((cy-drag.startY)/H)*100;
    r.x1 = clamp(drag.sx1+dxP); r.x2 = clamp(drag.sx2+dxP);
    r.y1 = clamp(drag.sy1+dyP); r.y2 = clamp(drag.sy2+dyP);
    renderAll(); syncRectCard(r);
  }
}
function onUp() { if(drag){ renderPanel(); drag=null; } }

// ═══════════════════════════════════════════════
// LIVE SYNC
// ═══════════════════════════════════════════════
function syncLineCard(l) {
  const card = document.querySelector(`.card[data-id="${l.id}"]`); if(!card) return;
  const inp = card.querySelectorAll('input[type=number]');
  if(inp[0]) inp[0].value = l.py.toFixed(1);
  if(inp[1]) inp[1].value = Math.round(l.labelX);
}
function syncRectCard(r) {
  const card = document.querySelector(`.card[data-rid="${r.id}"]`); if(!card) return;
  const inp = card.querySelectorAll('input[type=number]');
  if(inp[0]) inp[0].value = r.x1.toFixed(1);
  if(inp[1]) inp[1].value = r.y1.toFixed(1);
  if(inp[2]) inp[2].value = r.x2.toFixed(1);
  if(inp[3]) inp[3].value = r.y2.toFixed(1);
}

// ═══════════════════════════════════════════════
// PREVIEW
// ═══════════════════════════════════════════════
function enterPreview() {
  document.body.classList.add('preview');
  setTimeout(renderAll, 60);
}
function exitPreview() {
  document.body.classList.remove('preview');
  setTimeout(renderAll, 60);
}

// ═══════════════════════════════════════════════
// DOWNLOAD
// ═══════════════════════════════════════════════
async function downloadImg() {
  // temporarily enter preview so handles are hidden in export
  const wasPreview = document.body.classList.contains('preview');
  document.body.classList.add('preview');
  renderAll();
  await new Promise(r => setTimeout(r, 80));

  try {
    const canvas = await html2canvas(canvasEl, {
      useCORS: true,
      allowTaint: true,
      scale: 2,
      backgroundColor: '#ffffff',
      logging: false,
    });
    const link = document.createElement('a');
    link.download = 'mt5_chart_' + Date.now() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();

    const toast = document.getElementById('dl-toast');
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2500);
  } catch(err) {
    alert('Download gagal. Coba buka di browser Chrome.');
  }

  if (!wasPreview) {
    document.body.classList.remove('preview');
    setTimeout(renderAll, 60);
  }
}

// ═══════════════════════════════════════════════
// UTIL
// ═══════════════════════════════════════════════
function mkEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}
function addDragEvt(el, onMouse, onTouch) {
  el.addEventListener('mousedown',  e => { e.preventDefault(); e.stopPropagation(); onMouse(e); });
  el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); onTouch(e); }, { passive:false });
}
function clientXY(e) { return { x: e.clientX, y: e.clientY }; }
function touchXY(e)  { return { x: e.touches[0].clientX, y: e.touches[0].clientY }; }
function clamp(v, lo=0, hi=100) { return Math.max(lo, Math.min(hi, v)); }
